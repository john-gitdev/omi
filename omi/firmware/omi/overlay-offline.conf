#
# Offline Recorder Mode Overlay
#
# Build with: west build -b omi -- -DOVERLAY_CONFIG=overlay-offline.conf
#
# In this mode the device always records to SD card (never streams live
# over BLE). BLE + WiFi are kept solely for syncing files to the app.
#

CONFIG_OMI_OFFLINE_RECORDER=y
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=y
CONFIG_OMI_ENABLE_WIFI=y
CONFIG_OMI_ENABLE_BATTERY=y
CONFIG_OMI_ENABLE_BUTTON=y
CONFIG_OMI_ENABLE_HAPTIC=y
CONFIG_OMI_ENABLE_RFSW_CTRL=y
CONFIG_OMI_CODEC_OPUS=y
